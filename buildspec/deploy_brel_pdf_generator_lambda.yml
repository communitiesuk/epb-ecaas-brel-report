version: 0.2

phases:
  build:
    commands:
      - bash ./scripts/assume_role.sh arn:aws:iam::$AWS_ACCOUNT_ID:role/ci-server ci_server
      - export AWS_PROFILE=ci_server
      - aws lambda update-function-code --function-name brel-pdf-generator --zip-file fileb://$CODEBUILD_SRC_DIR_build_pdf_lambda_output/deployment.zip

  post_build:
    commands:
      - echo "BREL PDF Generator deployment complete"
